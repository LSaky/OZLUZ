    <article class="faq-row"><h2><button aria-expanded="false" aria-controls="faq-a1" id="faq-q1">¿Cuál es el tiempo de entrega de un pedido?<span class="chevron" aria-hidden="true"></span></button></h2><div class="faq-answer" id="faq-a1" role="region" aria-labelledby="faq-q1" hidden><p>El tiempo de producción es de 3 a 5 días hábiles a partir de la aprobación del diseño. Para envíos nacionales, suma de 1 a 3 días del envío.</p></div></article>
    <article class="faq-row faq-pink"><h2><button aria-expanded="false" aria-controls="faq-a2" id="faq-q2">¿Tienen un numero minimo de prendas?<span class="chevron" aria-hidden="true"></span></button></h2><div class="faq-answer" id="faq-a2" role="region" aria-labelledby="faq-q2" hidden><p>Si, al ser una marca orientada a la producción</p></div></article>
    <article class="faq-row"><h2><button aria-expanded="false" aria-controls="faq-a3" id="faq-q3">¿Como debo enviar mi diseño?<span class="chevron" aria-hidden="true"></span></button></h2><div class="faq-answer" id="faq-a3" role="region" aria-labelledby="faq-q3" hidden><p>Lo ideal es enviarlo en alta definición a 300 pp (pixeles por pulgada).</p></div></article>
